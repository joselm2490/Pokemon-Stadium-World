<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Stadium World - Explorador de Movimientos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(30, 41, 64, 0.9);
      --accent-blue: #00e5ff;
      --accent-gold: #ffd600;
      --accent-crimson: #ff1744;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --font-main: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #151d30 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    /* Animated Stadium grid background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
      position: relative;
      z-index: 1;
    }

    /* HEADER */
    header {
      text-align: center;
      padding: 30px 0 20px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-blue);
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 680px;
      margin: 0 auto 24px;
    }

    /* STATS BANNER */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 229, 255, 0.4);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--accent-blue);
    }

    .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* CONTROLS & FILTERS */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(16px);
      margin-bottom: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    .search-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input-wrap {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-input-wrap input {
      width: 100%;
      background: rgba(10, 13, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 14px 18px 14px 44px;
      color: #fff;
      font-size: 1rem;
      font-family: var(--font-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input-wrap input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 14px;
    }

    .filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      min-width: 80px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .pill-btn.active {
      background: var(--accent-blue);
      color: #0a0d14;
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
      font-weight: 700;
    }

    /* GRID DE MOVIMIENTOS */
    .moves-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .move-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .move-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.35);
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .move-id {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-blue);
      background: rgba(0, 229, 255, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .badge-wrap {
      display: flex;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    .badge-gigamax {
      background: linear-gradient(135deg, #ff1744, #d50000);
      color: #fff;
    }

    .badge-z {
      background: linear-gradient(135deg, #ffd600, #ff9100);
      color: #000;
    }

    .move-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .move-alt {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 400;
      margin-top: 2px;
    }

    .move-en {
      font-size: 0.85rem;
      color: var(--accent-blue);
      font-style: italic;
      margin-bottom: 12px;
    }

    .tags-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .type-pill {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .class-pill {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .class-fisico { background: #e53e3e; }
    .class-especial { background: #3182ce; }
    .class-estado { background: #718096; }

    /* STATS ROW IN CARD */
    .stats-matrix {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 10px;
      gap: 8px;
      text-align: center;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .matrix-item .label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .matrix-item .val {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .desc-text {
      font-size: 0.88rem;
      line-height: 1.45;
      color: #cbd5e1;
      flex-grow: 1;
    }

    .card-footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* TYPE COLORS */
    .type-Normal { background: #9fa19f; }
    .type-Fuego { background: #e62829; }
    .type-Agua { background: #2980ef; }
    .type-Planta { background: #3fa129; }
    .type-Eléctrico { background: #fac000; color: #111; text-shadow: none; }
    .type-Hielo { background: #3dcef3; color: #111; text-shadow: none; }
    .type-Lucha { background: #ff8000; }
    .type-Veneno { background: #9141cb; }
    .type-Tierra { background: #915121; }
    .type-Volador { background: #81b9ef; }
    .type-Psíquico { background: #ef4179; }
    .type-Bicho { background: #91a119; }
    .type-Roca { background: #afa981; }
    .type-Fantasma { background: #704170; }
    .type-Dragón { background: #5060e1; }
    .type-Siniestro { background: #50413f; }
    .type-Acero { background: #60a1b8; }
    .type-Hada { background: #ef70ef; }
    .type-Estelar { background: #24b89b; }

    /* PAGINATION */
    .pagination-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
    }

    .page-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-info {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-badge">⚔️ Base de Datos de Videojuego</div>
      <h1>Pokémon Stadium World</h1>
      <p class="subtitle">Catálogo Completo de Movimientos Oficiales (Gen 1 - Gen 9) extraídos y estructurados para el motor del juego.</p>
    </header>

    <!-- RESUMEN DE STATS -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">953</div>
        <div class="stat-label">Movimientos Totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">9</div>
        <div class="stat-label">Generaciones</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">18</div>
        <div class="stat-label">Tipos Elementales</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-showing">0</div>
        <div class="stat-label">Filtrados</div>
      </div>
    </div>

    <!-- CONTROLES -->
    <div class="controls-panel">
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar por nombre en español o inglés (ej: Lanzallamas, Flamethrower, Terremoto)...">
        </div>
      </div>

      <!-- Filtro por Clase -->
      <div class="filter-group">
        <span class="filter-label">Clase:</span>
        <button class="pill-btn active" data-class="all">Todas</button>
        <button class="pill-btn" data-class="Físico">Físico</button>
        <button class="pill-btn" data-class="Especial">Especial</button>
        <button class="pill-btn" data-class="Estado">Estado</button>
      </div>

      <!-- Filtro por Generación -->
      <div class="filter-group">
        <span class="filter-label">Gen:</span>
        <button class="pill-btn active" data-gen="all">Todas</button>
        <button class="pill-btn" data-gen="1">Gen 1</button>
        <button class="pill-btn" data-gen="2">Gen 2</button>
        <button class="pill-btn" data-gen="3">Gen 3</button>
        <button class="pill-btn" data-gen="4">Gen 4</button>
        <button class="pill-btn" data-gen="5">Gen 5</button>
        <button class="pill-btn" data-gen="6">Gen 6</button>
        <button class="pill-btn" data-gen="7">Gen 7</button>
        <button class="pill-btn" data-gen="8">Gen 8</button>
        <button class="pill-btn" data-gen="9">Gen 9</button>
      </div>

      <!-- Filtro por Tipo -->
      <div class="filter-group" id="typeFilters">
        <span class="filter-label">Tipo:</span>
        <button class="pill-btn active" data-type="all">Todos</button>
        <!-- Dinámicos -->
      </div>
    </div>

    <!-- GRID -->
    <div class="moves-grid" id="movesGrid">
      <div class="empty-state">Cargando movimientos...</div>
    </div>

    <!-- PAGINACIÓN -->
    <div class="pagination-bar">
      <button class="page-btn" id="prevPage">◀ Anterior</button>
      <span class="page-info" id="pageInfo">Página 1 de 1</span>
      <button class="page-btn" id="nextPage">Siguiente ▶</button>
    </div>
  </div>

  <script>
    let allMoves = [];
    let filteredMoves = [];
    let currentPage = 1;
    const PAGE_SIZE = 24;

    let selectedClass = 'all';
    let selectedGen = 'all';
    let selectedType = 'all';
    let searchQuery = '';

    const TYPES = [
      'Normal', 'Fuego', 'Agua', 'Planta', 'Eléctrico', 'Hielo',
      'Lucha', 'Veneno', 'Tierra', 'Volador', 'Psíquico', 'Bicho',
      'Roca', 'Fantasma', 'Dragón', 'Siniestro', 'Acero', 'Hada'
    ];

    function initTypeButtons() {
      const wrap = document.getElementById('typeFilters');
      TYPES.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'pill-btn';
        btn.dataset.type = t;
        btn.textContent = t;
        wrap.appendChild(btn);
      });
    }

    async function loadData() {
      try {
        const res = await fetch('../data/movimientos.json');
        if (!res.ok) throw new Error("Fetch falló");
        allMoves = await res.json();
      } catch (e) {
        console.warn("Cargando desde fallback local:", e);
        // Fallback en caso de CORS estricto abriendo directo file://
        const res = await fetch('movimientos_data.json');
        allMoves = await res.json();
      }
      document.getElementById('stat-total').textContent = allMoves.length;
      applyFilters();
    }

    function applyFilters() {
      filteredMoves = allMoves.filter(m => {
        if (selectedClass !== 'all' && m.clase !== selectedClass) return false;
        if (selectedGen !== 'all' && m.gen != selectedGen) return false;
        if (selectedType !== 'all' && m.tipo !== selectedType) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchName = m.nombre && m.nombre.toLowerCase().includes(q);
          const matchAlt = m.nombre_alt && m.nombre_alt.toLowerCase().includes(q);
          const matchEn = m.nombre_ingles && m.nombre_ingles.toLowerCase().includes(q);
          const matchDesc = m.descripcion && m.descripcion.toLowerCase().includes(q);
          if (!matchName && !matchAlt && !matchEn && !matchDesc) return false;
        }
        return true;
      });

      document.getElementById('stat-showing').textContent = filteredMoves.length;
      currentPage = 1;
      render();
    }

    function render() {
      const grid = document.getElementById('movesGrid');
      grid.innerHTML = '';

      if (filteredMoves.length === 0) {
        grid.innerHTML = '<div class="empty-state">No se encontraron movimientos con los filtros seleccionados.</div>';
        document.getElementById('pageInfo').textContent = 'Página 0 de 0';
        document.getElementById('prevPage').disabled = true;
        document.getElementById('nextPage').disabled = true;
        return;
      }

      const totalPages = Math.ceil(filteredMoves.length / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filteredMoves.slice(start, start + PAGE_SIZE);

      pageItems.forEach(m => {
        const card = document.createElement('div');
        card.className = 'move-card';

        const classKey = m.clase ? m.clase.toLowerCase() : 'fisico';
        const typeKey = m.tipo || 'Normal';

        let badgeHtml = '';
        if (m.es_gigamax) {
          badgeHtml += '<span class="badge badge-gigamax">Gigamax</span>';
        }
        if (m.es_movimiento_z) {
          badgeHtml += '<span class="badge badge-z">Mov-Z</span>';
        }

        const altHtml = m.nombre_alt ? `<div class="move-alt">LA: ${m.nombre_alt}</div>` : '';
        const pot = m.potencia_texto || '-';
        const prec = m.precision_texto || '-';
        const pp = m.pp_texto || '-';

        card.innerHTML = `
          <div class="card-top">
            <span class="move-id">#${m.codigo}</span>
            <div class="badge-wrap">${badgeHtml}</div>
          </div>
          <div class="move-name">${m.nombre}</div>
          ${altHtml}
          <div class="move-en">${m.nombre_ingles}</div>
          
          <div class="tags-row">
            <span class="type-pill type-${typeKey}">${m.tipo}</span>
            <span class="class-pill class-${classKey}">${m.clase}</span>
          </div>

          <div class="stats-matrix">
            <div class="matrix-item">
              <div class="label">Potencia</div>
              <div class="val">${pot}</div>
            </div>
            <div class="matrix-item">
              <div class="label">Precisión</div>
              <div class="val">${prec}</div>
            </div>
            <div class="matrix-item">
              <div class="label">PP</div>
              <div class="val">${pp}</div>
            </div>
          </div>

          <div class="desc-text">${m.descripcion || 'Sin descripción disponible.'}</div>
          
          <div class="card-footer">
            <span>Gen ${m.gen}</span>
            <span>Prioridad: ${m.prioridad || 0}</span>
          </div>
        `;

        grid.appendChild(card);
      });

      document.getElementById('pageInfo').textContent = `Página ${currentPage} de ${totalPages}`;
      document.getElementById('prevPage').disabled = currentPage === 1;
      document.getElementById('nextPage').disabled = currentPage === totalPages;
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      initTypeButtons();

      document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        applyFilters();
      });

      document.querySelectorAll('[data-class]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-class]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedClass = btn.dataset.class;
          applyFilters();
        });
      });

      document.querySelectorAll('[data-gen]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-gen]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedGen = btn.dataset.gen;
          applyFilters();
        });
      });

      document.getElementById('typeFilters').addEventListener('click', (e) => {
        if (e.target.dataset.type) {
          document.querySelectorAll('#typeFilters .pill-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          selectedType = e.target.dataset.type;
          applyFilters();
        }
      });

      document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('nextPage').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredMoves.length / PAGE_SIZE);
        if (currentPage < totalPages) {
          currentPage++;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      loadData();
    });
  </script>
</body>
</html>
