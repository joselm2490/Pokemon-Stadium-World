<!DOCTYPE html>
<html>
<head>
  <base href="/showdown/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Stadium Battle</title>
  <link rel="stylesheet" href="style/font-awesome.css" />
  <link rel="stylesheet" href="style/battle.css" />
  <link rel="stylesheet" href="style/sim-types.css" />
  <link rel="stylesheet" href="style/utilichart.css" />
  <link rel="stylesheet" href="style/client2.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .arena-battle-layout {
      display: flex;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .arena-battle-stage {
      flex: 1;
      height: 100%;
      position: relative;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .battle-wrapper {
      position: relative;
      width: 640px;
      height: 360px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      background: #000;
    }
    .arena-controls-bar {
      width: 640px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      margin-top: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .controls-prompt {
      font-size: 0.85rem;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .moves-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .move-btn {
      height: 48px;
      border: none;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.92rem;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      transition: all 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .move-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }
    .move-btn:active:not(:disabled) {
      transform: translateY(1px);
    }
    .move-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
    .move-btn .pp-tag {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.9;
    }
    .switches-bar {
      display: flex;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.1);
      align-items: center;
    }
    .switch-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #94a3b8;
      margin-right: 4px;
    }
    .switch-btn {
      flex: 1;
      height: 36px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .switch-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
    }
    .switch-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .arena-side-log {
      width: 320px;
      height: 100%;
      background: #090d16;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
    }
    .log-header {
      padding: 10px 14px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #38bdf8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.8);
    }
    .battle-log {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-size: 0.82rem;
      line-height: 1.4;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="arena-battle-layout">
    <div class="arena-battle-stage">
      <div class="battle-wrapper">
        <div class="battle" id="battleStage"></div>
      </div>

      <div class="arena-controls-bar" id="battleControlsBar">
        <div class="controls-prompt">
          <span id="promptText">🎮 ¿Qué debería hacer tu Pokémon?</span>
          <span id="turnIndicator" style="color: #94a3b8; font-size: 0.75rem;">Turno 1</span>
        </div>
        <div class="moves-grid" id="movesGrid"></div>
        <div class="switches-bar" id="switchesBar"></div>
      </div>
    </div>

    <div class="arena-side-log">
      <div class="log-header">📜 REGISTRO DE COMBATE</div>
      <div class="battle-log" id="battleLog"></div>
    </div>
  </div>

  <script src="js/lib/jquery-2.2.4.min.js"></script>
  <script src="config/config.js"></script>
  <script src="js/lib/ps-polyfill.js"></script>
  <script src="js/lib/html-css-sanitizer-minified.js"></script>
  <script src="js/battle-sound.js"></script>
  <script src="js/battle-dex-data.js"></script>
  <script src="js/battle-dex.js"></script>
  <script src="data/graphics.js"></script>
  <script src="data/pokedex.js"></script>
  <script src="data/moves.js"></script>
  <script src="data/abilities.js"></script>
  <script src="data/items.js"></script>
  <script src="data/teambuilder-tables.js"></script>
  <script src="js/battle-text-parser.js"></script>
  <script src="src/battle-log-misc.js"></script>
  <script src="js/battle-log.js"></script>
  <script src="js/battle-tooltips.js"></script>
  <script src="js/battle-animations.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/stadium-pure-battle.js"></script>
</body>
</html>
